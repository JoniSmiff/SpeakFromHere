name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches manifest.json
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $TAG does not match manifest version $VERSION."
            echo "Obsidian looks for a release tagged exactly as the manifest version, with no leading v."
            exit 1
          fi

      - name: Check main.js parses
        run: node --check main.js

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            main.js manifest.json styles.css
